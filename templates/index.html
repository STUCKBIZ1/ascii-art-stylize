<!DOCTYPE html>
<html lang="en">
<head>
  <title>ascii-art</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background-color: #0f172a;
      color: #e5e7eb;
      height: 100vh;             
      display: flex;
      flex-direction: column;    
    }
    .top {
      height: 50vh;             
      display: flex;
      justify-content: center;
      align-items: center;
    }

    form {
      background-color: #020617;
      width: 90%;
      max-width: 800px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 15px;
      border-radius: 8px;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    label {
      display: inline-block;
      margin-right: 15px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .bottom {
      height: 50vh;     
      width: 100%;
      padding: 20px;
    }

    .result-container {
      height: 100%;
      width: 100%;
      background-color: #020617;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

  pre {
  height: 100%;
  margin: 0;
  background-color: black;
  color: #22c55e;
  padding: 20px;
  border-radius: 10px;

  font-family: "Courier New", Courier, monospace;
  font-size: 14px;
  line-height: 1.1;

  white-space: pre;     
  overflow-x: auto;      
  overflow-y: auto;  
}
  </style>
</head>

<body>

  <div class="top">
    <form action="/ascii-art" method="POST">

      <textarea required maxlength="2000" name="text"
        placeholder="Enter text here..."></textarea>

      <label>
        <input type="radio" name="banner" value="standard" checked> standard
      </label>

      <label>
        <input type="radio" name="banner" value="shadow"> shadow
      </label>

      <label>
        <input type="radio" name="banner" value="thinkertoy"> thinkertoy
      </label>

      <button type="submit">Generate</button>
    </form>
  </div>

  <div class="bottom">
    {{if .Result}}
    <div class="result-container">
      <pre>{{.Result}}</pre>
    </div>
    {{end}}
  </div>

</body>
</html>
